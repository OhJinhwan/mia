<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>119 응급구조대 미션</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#ecf5ff;background:#0c1730}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#203e69,#0c1730 63%)}button,input{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,5vw,64px);border-bottom:1px solid #37506d}header strong{font-size:23px}header span{color:#b5c6db}.wrap{max-width:1080px;margin:auto;padding:35px 22px 70px}.eyebrow{color:#78e1d4;font-weight:900;letter-spacing:2px}h1{font-size:clamp(30px,5vw,55px);margin:10px 0}h2{margin:0 0 15px;font-size:27px}p{line-height:1.75;color:#c8d8e9}.card{background:#162b48;border:1px solid #365171;border-radius:22px;padding:26px;box-shadow:0 16px 36px #07132444;margin:16px 0}.hero{background:linear-gradient(120deg,#1c4470,#143452);padding:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.case{color:white;text-align:left;border:1px solid #48658a;background:#203958;padding:19px;border-radius:15px;transition:.2s}.case:hover,.case:focus{border-color:#68eadb;transform:translateY(-2px)}.case .emoji{font-size:40px;display:block;margin-bottom:9px}.case b{display:block;font-size:18px}.case small{color:#b4cde5;line-height:1.6}.btn{border:0;border-radius:12px;background:#48d5c4;color:#072c34;font-weight:900;padding:13px 19px}.btn.secondary{background:#2a4565;color:#e8f2ff}.btn:disabled{opacity:.42;cursor:not-allowed}.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.pill{border:1px solid #5d819f;border-radius:25px;padding:7px 13px;font-size:13px;color:#c7e4f2}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}.toolbar .meter{flex:1;min-width:130px;height:10px;background:#2c4765;border-radius:20px;overflow:hidden}.bar{background:#46d5c5;height:100%;transition:.3s}.question{font-size:20px;color:#fff;font-weight:850}.choice{width:100%;text-align:left;border:1px solid #456785;background:#203a5b;color:#eff8ff;border-radius:13px;padding:15px 17px;margin:6px 0;display:flex;gap:12px;align-items:center}.choice:hover{background:#2b4b6e}.choice.active{background:#235955;border-color:#67e6cb}.letter{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#344f70;flex-shrink:0}.choice.active .letter{background:#42cfbd;color:#09333a}.alert{background:#533b30;border:1px solid #a57157;color:#ffe3c4;padding:15px;border-radius:12px;margin:12px 0}.good{background:#193f42;border:1px solid #4ac8b6;color:#c9fff1;padding:15px;border-radius:12px;margin:12px 0}.muted{font-size:14px;color:#a8c0d6}.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.item{background:#203a57;border:2px solid #405f7b;border-radius:15px;color:white;padding:13px;min-height:142px}.item.active{border-color:#55e5d2;background:#1f5957}.item .big{font-size:38px;display:block}.item b,.item small{display:block;margin-top:5px}.item small{color:#adc9dd}.stack{display:flex;flex-wrap:wrap;gap:9px;min-height:45px;padding:12px;border:1px dashed #58799c;border-radius:14px}.tag{border:none;background:#315979;color:white;border-radius:10px;padding:9px 12px}.tag.selected{background:#27a99a;color:white}.step{padding:12px;border-radius:11px;background:#214665;margin:7px 0;display:flex;justify-content:space-between;align-items:center}.step button{border:0;color:white;background:#3e6180;padding:7px 11px;border-radius:8px}.label{font-weight:800;color:#83e5d8;margin:12px 0 4px}.result{font-size:20px;font-weight:900}.hidden{display:none}footer{color:#96b0cb;text-align:center;font-size:12px;padding:25px}@media(max-width:600px){header strong{font-size:17px}header span{font-size:12px}.card{padding:19px}.hero{padding:24px}}

</style></head><body><header><strong>🚑 119 응급구조대</strong><span>초등 보건 · 미션형 학습 게임</span></header><main id="app" class="wrap" aria-live="polite"></main><footer>교육용 시뮬레이션입니다. 실제 위급 상황에서는 즉시 119 신고 및 주변 어른에게 도움을 요청하세요.</footer><script>
const cases=[
{id:'wound',emoji:'🩹',name:'운동장 찰과상',scene:'달리기를 하던 친구가 넘어졌습니다. 무릎에 흙이 묻고 피가 조금 나요.',clue:'출혈이 심하거나 깊은 상처라면 즉시 어른에게 알리고 의료진의 도움을 받아야 해요.',items:['water','gauze','bandage'],steps:['어른에게 알리고 손을 깨끗이 한다.','흐르는 깨끗한 물로 상처에 묻은 이물질을 씻는다.','필요하면 깨끗한 거즈로 부드럽게 압박해 출혈을 멈춘다.','깨끗한 드레싱이나 밴드로 상처를 보호한다.'],why:{q:'흙이 묻은 찰과상을 깨끗한 물로 씻는 가장 중요한 이유는?',opts:['상처를 일부러 따갑게 하기 위해','상처의 오염물질을 제거해 감염 위험을 줄이기 위해','피가 더 많이 나오게 하기 위해'],answer:1,ex:'흐르는 깨끗한 물로 씻으면 흙과 오염물질을 제거해 감염 위험을 낮추는 데 도움이 됩니다.'},twist:{text:'상처에서 피가 계속 많이 나고 아이가 어지럽다고 합니다. 이제 어떻게 해야 할까요?',opts:['혼자 교실로 돌려보낸다.','즉시 어른과 119에 도움을 요청하고 깨끗한 거즈로 직접 압박한다.','상처에 흙을 덮는다.'],answer:1,ex:'심한 출혈과 어지럼은 긴급한 평가가 필요할 수 있어요. 도움을 요청하고 가능한 범위에서 직접 압박합니다.'}},
{id:'nose',emoji:'👃',name:'갑자기 코피',scene:'교실에서 친구가 갑자기 코피를 흘립니다. 친구는 고개를 뒤로 젖히려고 해요.',clue:'머리를 뒤로 젖히지 않아요. 심한 출혈이나 머리 부상 후 출혈은 즉시 도움을 받아야 해요.',items:['tissue','gloves'],steps:['친구를 앉히고 몸과 머리를 조금 앞으로 기울이게 한다.','콧방울의 말랑한 부분을 엄지와 검지로 누른다.','중간에 떼어 확인하지 않고 10~15분 동안 지속해서 누른다.','출혈이 멈추지 않거나 심하면 어른에게 알리고 진료받는다.'],why:{q:'코피가 날 때 고개를 앞으로 기울이는 이유는?',opts:['피가 목 뒤로 넘어가는 것을 줄이기 위해','코를 더 아프게 하기 위해','코피가 눈으로 나오게 하기 위해'],answer:0,ex:'머리를 뒤로 젖히면 피가 목으로 넘어갈 수 있어요. 앞으로 약간 숙이고 콧방울을 압박합니다.'},twist:{text:'15분 이상 제대로 눌렀는데도 피가 계속 많이 흐릅니다. 무엇을 할까요?',opts:['코를 세게 풀게 한다.','어른에게 즉시 알리고 의료적 도움을 받는다.','뒤로 눕혀 재운다.'],answer:1,ex:'지속되거나 많은 코피는 의료진의 평가가 필요합니다.'}},
{id:'burn',emoji:'🔥',name:'뜨거운 물 화상',scene:'급식실 근처에서 친구의 손등에 뜨거운 물이 튀었습니다. 피부가 빨갛고 아파요.',clue:'큰 화상, 얼굴·손 등 중요한 부위의 심한 화상, 호흡 곤란은 즉시 도움을 요청해요.',items:['water','dressing'],steps:['안전을 확인하고 어른에게 즉시 알린다.','화상 부위를 시원한 흐르는 물로 약 20분 식히기 시작한다.','물로 식히는 동안 달라붙지 않은 반지·시계를 조심스럽게 제거한다.','충분히 식힌 뒤 깨끗한 비점착성 드레싱으로 느슨하게 보호하고 어른과 진료받는다.'],why:{q:'화상 부위에 흐르는 시원한 물을 사용하는 주된 이유는?',opts:['피부에 남아 있는 열을 식혀 손상을 줄이기 위해','화상 부위를 얼리기 위해','물집을 터뜨리기 위해'],answer:0,ex:'시원한 흐르는 물로 열을 식히면 화상 손상이 진행되는 것을 줄이는 데 도움이 됩니다. 얼음은 피부 손상을 악화시킬 수 있어요.'},twist:{text:'친구가 “얼음을 바로 피부에 붙여 줘!”라고 합니다. 어떻게 할까요?',opts:['얼음을 피부에 직접 오래 댄다.','흐르는 시원한 물로 식히고 도움을 요청한다.','치약을 발라 준다.'],answer:1,ex:'얼음이나 치약은 권장하지 않습니다. 흐르는 시원한 물로 냉각해요.'}},
{id:'ankle',emoji:'🦶',name:'발목을 접질렀어요',scene:'축구를 하던 친구가 발목을 삐끗했습니다. 붓고 통증이 있어 제대로 걷기 어려워요.',clue:'다친 발을 억지로 걷게 하거나 꺾지 않아요. 체중을 싣기 어려우면 진료가 필요할 수 있어요.',items:['cold','cloth'],steps:['활동을 중단하고 안전한 곳에서 쉬도록 돕는다.','어른에게 알리고 통증과 부기, 보행 가능 여부를 확인한다.','수건으로 싼 냉찜질 팩을 한 번에 20분 이내로 대며 피부 상태를 살핀다.','무리해서 걷지 않게 하고 필요하면 진료를 받는다.'],why:{q:'냉찜질 팩을 수건으로 감싸서 사용하는 이유는?',opts:['피부가 과하게 차가워져 손상되는 것을 막기 위해','얼음을 더 뜨겁게 만들기 위해','발목을 더 세게 누르기 위해'],answer:0,ex:'차가운 팩을 피부에 직접 오래 대면 냉손상이 생길 수 있어요. 얇은 수건 등으로 감싸서 사용합니다.'},twist:{text:'친구가 발에 체중을 거의 실을 수 없고 발목 모양도 이상해 보입니다. 어떻게 할까요?',opts:['걸어 보라고 계속 시킨다.','움직임을 최소화하고 어른과 의료진의 도움을 받는다.','세게 주무른다.'],answer:1,ex:'골절 등 심한 손상 가능성이 있어 함부로 걷거나 조작하지 않도록 해요.'}},
{id:'eye',emoji:'👁️',name:'눈에 먼지가!',scene:'운동장 바람 때문에 친구의 눈에 먼지가 들어갔습니다. 따갑다며 눈을 비비려고 해요.',clue:'눈에 박힌 물체, 화학물질, 심한 통증이나 시력 변화는 일반 먼지와 다르게 대처해야 해요.',items:[],alternatives:[['water','saline']],steps:['눈을 비비지 말고 어른에게 알린다.','손을 깨끗이 하고, 박힌 물체가 의심되면 건드리지 않고 즉시 진료받는다.','깨끗한 물이나 멸균 생리식염수로 부드럽게 씻어낸다.','통증이나 이물감이 지속되면 의료진의 도움을 받는다.'],why:{q:'눈에 먼지가 들어갔을 때 비비지 않아야 하는 이유는?',opts:['먼지가 눈을 긁어 손상을 줄 수 있기 때문에','눈이 너무 깨끗해지기 때문에','눈물이 마르기 때문에'],answer:0,ex:'먼지가 있는 상태에서 비비면 각막 표면에 상처를 낼 수 있어요.'},twist:{text:'씻어도 눈을 뜨기 힘들고 시야가 흐려졌다고 합니다. 어떻게 해야 할까요?',opts:['계속 눈을 세게 문지른다.','즉시 어른에게 알리고 의료진에게 진료받는다.','일단 혼자 자게 한다.'],answer:1,ex:'시력 변화나 심한 통증은 신속한 진료가 필요한 위험 신호예요.'}},
{id:'bee',emoji:'🐝',name:'벌에 쏘였어요',scene:'현장체험학습 중 친구의 팔에 벌이 앉았다가 쏘았습니다. 팔이 아프고 빨갛게 부어올라요.',clue:'숨쉬기 어려움, 목·혀 부종, 심한 어지러움은 아나필락시스 가능성이 있으므로 즉시 119에 신고해야 해요.',items:['card','water','cold','cloth'],steps:['벌이 있는 곳에서 안전하게 벗어나고 어른에게 알린다.','남은 벌침이 보이면 가능한 한 빨리 조심스럽게 제거한다.','비누와 물로 씻고 수건으로 싼 냉찜질을 한다.','호흡 곤란이나 전신 증상이 생기는지 관찰한다.'],why:{q:'벌에 쏘인 뒤 남아 있는 벌침을 빨리 제거하는 이유는?',opts:['독이 더 들어갈 가능성을 줄이기 위해','벌을 다시 부르기 위해','피부를 더 깊게 찌르기 위해'],answer:0,ex:'남은 벌침은 신속하게 제거하는 것이 중요해요. 카드 가장자리 등으로 밀어 제거할 수 있으며, 제거 방식보다 신속성이 중요합니다.'},twist:{text:'갑자기 친구가 숨이 차고 목이 조이는 듯하다고 합니다. 무엇을 할까요?',opts:['가만히 기다린다.','즉시 119 신고와 어른의 도움을 요청하고, 처방된 에피네프린 자동주사기가 있다면 교육받은 사람이 사용하도록 돕는다.','물을 억지로 먹인다.'],answer:1,ex:'심한 알레르기 반응은 생명을 위협할 수 있어요. 즉시 119에 신고하고 응급 대응이 필요합니다.'}}
];
const catalog=[{id:'water',e:'💧',n:'깨끗한 물',price:20},{id:'gauze',e:'⬜',n:'멸균 거즈',price:20},{id:'bandage',e:'🩹',n:'밴드',price:15},{id:'tissue',e:'🧻',n:'휴지',price:10},{id:'gloves',e:'🧤',n:'일회용 장갑',price:15},{id:'dressing',e:'🩹',n:'깨끗한 드레싱',price:20},{id:'cold',e:'🧊',n:'냉찜질 팩',price:25},{id:'cloth',e:'🧣',n:'수건',price:10},{id:'saline',e:'🧴',n:'생리식염수',price:20},{id:'card',e:'💳',n:'납작한 카드',price:10},{id:'cream',e:'🧴',n:'정체 모를 연고',price:30},{id:'ice',e:'❄️',n:'얼음 직접 대기',price:5},{id:'soda',e:'🥤',n:'탄산음료',price:10}];
let state={case:-1,stage:0,bought:[],order:[],answer:null,feedback:'',team:''};const el=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{sessionStorage.setItem('emergencyGame',JSON.stringify(state))}catch{}}function set(o){state={...state,...o};save();render()}function restart(){state={case:-1,stage:0,bought:[],order:[],answer:null,feedback:'',team:''};save();render()}
function render(){if(state.case<0)return home();let c=cases[state.case];let phase=state.stage;let title=['사건 접수','장비 상점','처치 순서','과학 수사','긴급 변수','임무 완료'][phase];el.innerHTML=`<div class="toolbar"><span class="pill">🚨 ${esc(c.name)}</span><span class="pill">${esc(state.team||'구조대')} 팀</span><span class="pill">${phase+1}/6 · ${title}</span><div class="meter"><div class="bar" style="width:${(phase+1)/6*100}%"></div></div><button class="btn secondary" onclick="restart()">처음으로</button></div>`; if(phase===0)scene(c);if(phase===1)shop(c);if(phase===2)order(c);if(phase===3)quiz(c,'why');if(phase===4)quiz(c,'twist');if(phase===5)finish(c)}
function home(){el.innerHTML=`<section class="card hero"><div class="eyebrow">🚨 MISSION START</div><h1>응급구조대<br>생명을 구하는 미션</h1><p>구조 요청이 도착했습니다! 사건을 분석하고, 장비를 구매하고, 올바른 응급처치의 이유까지 밝혀주세요.</p><label class="label" for="team">우리 모둠 이름</label><input id="team" maxlength="24" placeholder="예: 번개 구조대" style="display:block;width:100%;max-width:350px;background:#0e2744;border:1px solid #6d8aaa;border-radius:11px;padding:13px;color:white"><p class="muted">※ 한 모둠당 하나의 사건을 선택하세요. 다른 사건도 다시 플레이할 수 있습니다.</p></section><h2>📟 구조 요청 선택</h2><div class="grid">${cases.map((c,i)=>`<button class="case" onclick="start(${i})"><span class="emoji">${c.emoji}</span><b>${esc(c.name)}</b><small>${esc(c.scene)}</small></button>`).join('')}</div><p class="muted">실제 위급 상황에서는 게임을 진행하지 않고 즉시 주변 어른과 119에 도움을 요청하세요.</p>`}
function start(i){let team=document.getElementById('team')?.value.trim()||`제${i+1}구조대`;set({case:i,team,stage:0,bought:[],order:[],answer:null,feedback:''})}
function scene(c){el.innerHTML+=`<section class="card hero"><div class="eyebrow">MISSION 01 · 출동 명령</div><h1>${c.emoji} ${esc(c.name)}</h1><p style="font-size:21px;color:white">${esc(c.scene)}</p><div class="alert">📢 구조본부 안내: ${esc(c.clue)}</div><div class="btnrow"><button class="btn" onclick="set({stage:1})">사건 분석 완료 · 장비 상점으로 →</button></div></section>`}
function shop(c){let total=state.bought.reduce((s,id)=>s+catalog.find(x=>x.id===id).price,0);el.innerHTML+=`<section class="card"><div class="eyebrow">MISSION 02 · 응급처치 장비 상점</div><h2>100코인 안에서 장비를 고르세요!</h2><p>사건에 필요한 장비를 클릭해 장바구니에 넣어 보세요. 꼭 필요한 장비를 빠뜨리지 않았는지 생각하세요. 눈 세척에는 깨끗한 물과 멸균 생리식염수 중 하나를 준비하면 됩니다.</p><h2>🪙 남은 코인: ${100-total}</h2><div class="shop">${catalog.map(i=>`<button class="item ${state.bought.includes(i.id)?'active':''}" onclick="toggleItem('${i.id}')"><span class="big">${i.e}</span><b>${i.n}</b><small>${i.price} 코인 ${state.bought.includes(i.id)?'✓ 선택됨':''}</small></button>`).join('')}</div>${state.feedback?`<div class="${state.feedback==='ok'?'good':'alert'}">${state.feedback==='ok'?'✅ 필요한 기본 장비를 준비했어요!':esc(shopFeedback(c))}</div>`:''}<div class="btnrow"><button class="btn secondary" onclick="set({stage:0,feedback:''})">← 뒤로</button><button class="btn" onclick="checkShop()">장비 검사하기</button>${state.feedback==='ok'?'<button class="btn" onclick="set({stage:2,feedback:\'\'})">다음 미션 →</button>':''}</div></section>`}
function toggleItem(id){let list=state.bought.includes(id)?state.bought.filter(x=>x!==id):[...state.bought,id];if(list.reduce((s,v)=>s+catalog.find(x=>x.id===v).price,0)>100){state.feedback='budget';save();render();return}set({bought:list,feedback:''})}
function shopIssues(c){
const name=id=>catalog.find(x=>x.id===id).n;
const missing=c.items.filter(id=>!state.bought.includes(id)).map(name);
for(const group of c.alternatives||[])if(!group.some(id=>state.bought.includes(id)))missing.push(group.map(name).join(' 또는 '));
const unsafe=['cream','ice','soda'].filter(id=>state.bought.includes(id)).map(name);
return {missing,unsafe};
}
function shopFeedback(c){
if(state.feedback==='budget')return '⚠️ 100코인을 초과할 수 없어요. 선택한 장비를 눌러 빼고 다시 골라 주세요.';
const {missing,unsafe}=shopIssues(c);
return ['⚠️ 장비를 다시 확인해 주세요.',missing.length?'준비할 장비: '+missing.join(', ')+'.':'',unsafe.length?'빼야 할 선택: '+unsafe.join(', ')+'.':''].filter(Boolean).join(' ');
}
function checkShop(){const {missing,unsafe}=shopIssues(cases[state.case]);set({feedback:!missing.length&&!unsafe.length?'ok':'retry'})}
function order(c){let available=c.steps.map((t,i)=>({i,t})).sort((a,b)=>[2,0,3,1][a.i]-[2,0,3,1][b.i]);let left=available.filter(x=>!state.order.includes(x.i));el.innerHTML+=`<section class="card"><div class="eyebrow">MISSION 03 · 응급처치 알고리즘</div><h2>올바른 처치 순서를 완성하라!</h2><p>아래 행동을 <b>실시할 순서대로</b> 선택하세요. 잘못 선택했다면 선택한 행동을 눌러 취소할 수 있어요.</p><div class="label">선택 가능한 행동</div><div>${left.map(x=>`<button class="choice" onclick="addStep(${x.i})">${esc(x.t)}</button>`).join('')||'<p class="muted">모든 행동을 선택했습니다.</p>'}</div><div class="label">내가 만든 응급처치 순서</div><div class="stack">${state.order.map((i,n)=>`<button class="tag selected" onclick="removeStep(${i})">${n+1}. ${esc(c.steps[i])} ✕</button>`).join('')||'<span class="muted">행동을 순서대로 눌러 주세요.</span>'}</div>${state.feedback?`<div class="${state.feedback==='ok'?'good':'alert'}">${state.feedback==='ok'?'✅ 순서가 정확해요!':'⚠️ 순서를 다시 확인해 보세요. 안전 확보와 어른에게 알리기가 먼저예요.'}</div>`:''}<div class="btnrow"><button class="btn secondary" onclick="set({stage:1,feedback:''})">← 뒤로</button><button class="btn" onclick="checkOrder()">순서 확인</button>${state.feedback==='ok'?'<button class="btn" onclick="set({stage:3,feedback:\'\',answer:null})">다음 미션 →</button>':''}</div></section>`}
function addStep(i){set({order:[...state.order,i],feedback:''})}function removeStep(i){set({order:state.order.filter(x=>x!==i),feedback:''})}function checkOrder(){set({feedback:state.order.join(',')==='0,1,2,3'?'ok':'retry'})}
function quiz(c,type){let q=c[type],stage=type==='why'?4:5;el.innerHTML+=`<section class="card"><div class="eyebrow">MISSION 0${stage} · ${type==='why'?'왜 그렇게 해야 할까?':'새로운 긴급 상황!'}</div><h2>${type==='why'?'응급처치의 과학적 이유를 밝혀라!':'🚨 현장 상황이 바뀌었습니다!'}</h2><p class="question">${esc(q.q||q.text)}</p>${q.opts.map((v,i)=>`<button class="choice ${state.answer===i?'active':''}" onclick="set({answer:${i},feedback:''})"><span class="letter">${'ABC'[i]}</span>${esc(v)}</button>`).join('')}${state.feedback?`<div class="${state.feedback==='ok'?'good':'alert'}">${state.feedback==='ok'?'✅ '+esc(q.ex):'⚠️ 다시 생각해 보세요. 무엇이 환자의 안전을 가장 잘 지킬까요?'}</div>`:''}<div class="btnrow"><button class="btn secondary" onclick="set({stage:${stage-2},answer:null,feedback:''})">← 뒤로</button><button class="btn" onclick="set({feedback:state.answer===${q.answer}?'ok':'retry'})" ${state.answer===null?'disabled':''}>정답 확인</button>${state.feedback==='ok'?`<button class="btn" onclick="set({stage:${stage},answer:null,feedback:''})">${stage===5?'임무 완료 →':'긴급 상황 발생 →'}</button>`:''}</div></section>`}
function finish(c){el.innerHTML+=`<section class="card hero" style="text-align:center"><div style="font-size:75px">🏆</div><div class="eyebrow">MISSION COMPLETE</div><h1>구조 미션 성공!</h1><p class="result">${esc(state.team)} · ${esc(c.name)}</p><p>여러분은 상황을 분석하고, 장비를 선택하고, 처치 순서와 과학적 이유까지 확인했습니다.</p><div class="good">🎖️ 응급구조대 임무 완료 인증</div><p>마지막으로 실제 상황에서는 혼자 해결하려 하지 말고 즉시 어른에게 알리고 필요할 때 119를 부르세요.</p><div class="btnrow" style="justify-content:center"><button class="btn" onclick="window.print()">🖨️ 완료 화면 인쇄</button><button class="btn secondary" onclick="restart()">다른 사건 도전</button></div></section>`}
function validState(x){return x&&Number.isInteger(x.case)&&x.case>=-1&&x.case<cases.length&&Number.isInteger(x.stage)&&x.stage>=0&&x.stage<=5&&Array.isArray(x.bought)&&new Set(x.bought).size===x.bought.length&&x.bought.every(id=>catalog.some(i=>i.id===id))&&x.bought.reduce((sum,id)=>sum+catalog.find(i=>i.id===id).price,0)<=100&&Array.isArray(x.order)&&new Set(x.order).size===x.order.length&&x.order.every(i=>Number.isInteger(i)&&i>=0&&i<4)&&(x.answer===null||Number.isInteger(x.answer)&&x.answer>=0&&x.answer<3)&&typeof x.team==='string'&&x.team.length<=24&&['','ok','retry','budget'].includes(x.feedback)}
try{const x=JSON.parse(sessionStorage.getItem('emergencyGame'));if(validState(x))state={...x,feedback:''}}catch{}render();
</script></body></html>
